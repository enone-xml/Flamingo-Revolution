# Hand-picked milestones shown on the Timeline page, next to the events the site
# detects automatically (stories covered by 3+ outlets).
# Add one with a pull request: a date, one neutral sentence in English and
# Albanian, and a link to a reliable source that says exactly that.
milestones:
  - date: 2026-05-16
    en: "The first protest against the resort project is held at the Akërni construction site in the Pishë Poro–Narta area."
    sq: "Mbahet protesta e parë kundër projektit të resortit në kantierin e Akërnit, në zonën Pishë Poro–Nartë."
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/Flamingo_Revolution
  - date: 2026-05-23
    en: "Residents and environmental activists gather near the Narta Lagoon to protest the barbed-wire fencing of Pishë Poro–Narta beach, part of the protected Vjosa–Narta landscape."
    sq: "Banorë dhe aktivistë mjedisorë mblidhen pranë Lagunës së Nartës për të protestuar kundër rrethimit me tel me gjemba të plazhit Pishë Poro–Nartë, pjesë e peizazhit të mbrojtur Vjosë–Nartë."
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/Flamingo_Revolution
  - date: 2026-05-30
    en: "At a protest near the project site in Portonovo, confrontations occur between protesters and private security."
    sq: "Në një protestë pranë kantierit në Portonovo ndodhin përplasje mes protestuesve dhe sigurisë private."
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/Flamingo_Revolution
  - date: 2026-05-31
    en: "The protests expand in Tirana and begin their daily phase, with a march from the State Police Directorate."
    sq: "Protestat zgjerohen në Tiranë dhe nisin fazën e përditshme, me një marshim nga Drejtoria e Policisë së Shtetit."
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/Flamingo_Revolution
  - date: 2026-06-20
    en: "The movement's largest demonstration to date is held in Tirana as a nationwide anti-government mobilization, with participants from across Albania and the diaspora."
    sq: "Në Tiranë mbahet demonstrata më e madhe e lëvizjes deri atëherë, si mobilizim kombëtar antiqeveritar, me pjesëmarrës nga e gjithë Shqipëria dhe diaspora."
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/Flamingo_Revolution
  - date: 2026-06-22
    en: "The protest coordinating group presents a five-point platform, including calls for Rama's resignation and a 12-month non-partisan technical government."
    sq: "Grupi koordinues i protestës paraqet një platformë me pesë pika, ku përfshihen kërkesa për dorëheqjen e Ramës dhe një qeveri teknike jopartiake për 12 muaj."
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/Flamingo_Revolution
  - date: 2026-07-02
    en: "Protesters gather outside Parliament during a plenary session, in what Wikipedia describes as the movement's most serious escalation up to that point."
    sq: "Protestuesit mblidhen para Kuvendit gjatë një seance plenare, në atë që Wikipedia e përshkruan si përshkallëzimin më serioz të lëvizjes deri atëherë."
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/Flamingo_Revolution
  - date: 2026-07-04
    en: "A nationwide and diaspora mobilization is held in Tirana; Wikipedia reports hundreds of thousands of participants."
    sq: "Në Tiranë mbahet një mobilizim kombëtar dhe i diasporës; Wikipedia raporton qindra mijëra pjesëmarrës."
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/Flamingo_Revolution
  - date: 2026-08-18
    en: "The movement marks its 80th consecutive day of protests, marching from Skanderbeg Square to the Prime Minister's Office."
    sq: "Lëvizja shënon ditën e 80-të radhazi të protestave, me marshim nga sheshi Skënderbej te Kryeministria."
    source: European Western Balkans
    url: https://europeanwesternbalkans.com/2026/08/19/protesters-continue-to-repeat-demands-for-the-resignation-of-prime-minister-rama/
  - date: 2026-09-08
    en: "As Parliament resumes after the summer recess, police block protesters from reaching it and clashes follow; the protests had marked their 100th day the day before."
    sq: "Ndërsa Kuvendi rinis punën pas pushimeve verore, policia i ndalon protestuesit t'i afrohen dhe ndodhin përplasje; një ditë më parë protestat kishin shënuar ditën e 100-të."
    source: Al Jazeera
    url: https://www.aljazeera.com/news/2026/9/8/protesters-police-clash-in-albania-over-trump-linked-project
