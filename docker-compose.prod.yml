# Production additions: Caddy in front for HTTPS. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  web:
    ports: !reset []   # not published; only Caddy talks to it

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  caddy-data:
  caddy-config:
