services:
  web:
    build: .
    image: flamingo-watch:latest
    env_file: .env
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8000"
    volumes:
      - flamingo-data:/data
      - site-export:/export
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Uploads the static site to Cloudflare Pages. Only starts when .env has
  # COMPOSE_PROFILES=publish (see STATIC-HOSTING.md).
  publisher:
    build:
      context: .
      dockerfile: deploy/publisher.Dockerfile
    image: flamingo-publisher:latest
    profiles: ["publish"]
    env_file: .env
    depends_on: [web]
    volumes:
      - site-export:/export:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # Pulls merged pull requests from GitHub (only after their tests pass) and
  # rebuilds the site. Only starts when COMPOSE_PROFILES includes "autoupdate".
  updater:
    image: docker:cli
    profiles: ["autoupdate"]
    entrypoint: ["/bin/sh", "/repo/deploy/update-loop.sh"]
    init: true   # so "docker compose stop" ends it straight away
    user: "1000:1000"
    group_add: ["${DOCKER_GID:-1001}"]   # lets the updater use Docker
    environment:
      HOME: /tmp
      GIT_TERMINAL_PROMPT: "0"
    env_file: .env
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

volumes:
  flamingo-data:
  site-export:
